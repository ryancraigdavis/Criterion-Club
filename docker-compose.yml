services:
  api:
    build: ./backend
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:?set DOPPLER_TOKEN to a Doppler service token, e.g. in .env}
      DATA_DIR: /data
    volumes:
      - criterion-club-data:/data
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8766}:8080"
    restart: unless-stopped

volumes:
  criterion-club-data:
