server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Trust X-Forwarded-For only from private addresses (Caddy, the Docker bridge, the LAN), then hand
  # the API exactly one address so its throttles key on the real client.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html carries <!--# include virtual="/api/club/og" -->, which fills in the link-preview
  # tags for the next screening. If the API is down the page still loads, without them.
  location / {
    add_header Cache-Control "no-cache";
    ssi on;
    ssi_silent_errors on;
    try_files $uri /index.html;
  }
}
